<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTORA</title>
    <link rel="stylesheet" href="../Mini-Projects/node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        header{
            display: flex;
            justify-content: space-between;
            text-align: center;
            background-color: black;
            padding: 40px;
            border-bottom: 1px solid white;

        }
        .name{
            color: white;
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif 

        }
        .bi-stars{
            color: rgb(214,194,14);

        }
        nav{
            color: white;
            font-size: 20px;
            justify-content: space-between;
            display: flex;
            gap: 20px;

        }
        .table{
            background-color: rgb(214, 194, 14);
            font-size: 14px;
            font-weight: bold;
            width: 200px;
            padding: 14px;
            
        }
        .sec1{
            background-color: #1e152a;
        }
        h3{
            color: rgb(214, 194, 14);
            font-size: 10px;
            text-align: center;
        
            padding: 20px;
            
        }
        .p1{
            color: white;
            align-items: center;
            text-align: center;
            font-size: 50px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .p2{
            color: aliceblue;
            align-items: center;
            text-align: center;
            font-size: medium;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

    </style>

</head>
<body>
    <header>
    <div class="name">
        <span class="bi bi-stars"></span>
        <span class="head-name">TESTORA.</span>
    </div>

    <nav>
        <span>Home</span>
        <span>About</span>
        <span>Our Menu</span>
        <span>Specials</span>
        <span>Contact</span>
    </nav>

    <button class="table">RESERVE A TABLE</button>
    </header>
    <main>
        <section class="sec1">
        <h3>WELCOME TO TASTORA</h3>

        <p class="p1">EXPERIENCE THE<br>ART OF FINE DINING</p>
        <p class="p2">Discover extraordinary flavors, elegant dining and unforgettable moments crafted<br> with passion</p>

        <button class="menu">EXPLORE OUR MENU</button>

        <h4>A PERFECT BLEND OF TASTE & ELEGANCE</h4>
        </section>
    </main>

</body>
</html>
