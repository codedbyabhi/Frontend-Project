<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute Dashboard</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f1f5f9;
            padding: 25px;
        }
        .name{
            font-size: 30px;
            border-radius: 20px;
            font-weight: bold;
        }

        .nav span{
            margin: 0px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
        }

        .first_head {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 20px;
            background-color: #123C69;
            color: white;
            border-radius: 10px;
        }
        .second_head {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 20px;
            background-color: #cc2a4d;
            color: white;
            border-radius: 10px;
            margin-top: 20px;
        }
        .status{
            background-color: #DCFCE7;
            padding: 8px 18px;
            border-radius: 20px;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            color: #15803D;
        }
        
        </style>
</head>
<body>
    <header>
        <div class="first_head">
        <div>   
            <span class="name">BRAVINO</span>
        </div>
        <div class="nav">
            <span>Dashboard</span>
            <span>Course</span>
            <span>Profile</span>
        </div>
        </div>

        <div class="second_head">
            <div>
                <span>Abhijeet Pinjarkar</span>
                <span>Java Developer</span>
                <span>Batch : JAVA-61</span>
            </div>
            <div>
                <span class="status">ACTIVE</span>
            </div>
        </div>
        <div class="third_head">
            <span>Learning Statistics</span>
            <div>
                <span>12 Total Courses</span>
                <span>8 Completed</span>
                <span>4 Pending</span>
            </div>
        </div>
        <div class="fourth_head">

                <span>Technical Skills</span>
                <div>
                    <span>Java</span>
                    <span>HTML</span>
                    <span>CSS</span>
                    <span>JavaScript</span>
                    <span>SQL</span>
                </div>  
            </div>       
    </header>   
</body>
</html>
